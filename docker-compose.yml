version: '3.8'

services:
  backend:
    build: ./backend
    container_name: manifest_backend
    restart: always
    environment:
      - PORT=8000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend/audio_storage:/app/audio_storage
    depends_on:
      - redis
    ports:
      - "8000:8000"

  redis:
    image: redis:7-alpine
    container_name: manifest_redis
    restart: always
    ports:
      - "6379:6379"

  nginx:
    image: nginx:alpine
    container_name: manifest_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/audio_storage:/usr/share/nginx/html/audios:ro
    depends_on:
      - backend
